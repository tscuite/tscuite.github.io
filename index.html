<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tscuite</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --fg: #18181b;
    --muted: #71717a;
    --faint: #a1a1aa;
    --line: #e7e7ea;
    --accent: #dc4c3f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e11;
      --surface: #16161a;
      --fg: #e9e9ec;
      --muted: #8f8f98;
      --faint: #66666f;
      --line: #26262d;
      --accent: #ff6b52;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.7;
    min-height: 100vh;
  }
  .wrap { max-width: 660px; margin: 0 auto; padding: 40px 20px 88px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px;
  }
  .wordmark { font: 600 17px/1 var(--mono); letter-spacing: 0.02em; }
  .wordmark em { font-style: normal; color: var(--accent); }
  nav { display: flex; gap: 18px; }
  nav a {
    color: var(--muted); text-decoration: none; font: 13px var(--mono);
    transition: color .12s;
  }
  nav a:hover { color: var(--fg); }

  .note { padding: 26px 0; border-bottom: 1px solid var(--line); }
  .note:last-of-type { border-bottom: none; }
  .note .date { font: 12px var(--mono); color: var(--accent); letter-spacing: 0.06em; }
  .note h3 { font-size: 18px; font-weight: 650; margin: 6px 0 16px; }

  .repo {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    column-gap: 12px; row-gap: 3px;
    align-items: baseline;
    padding: 13px 14px;
    border-radius: 10px;
    text-decoration: none;
    transition: background .12s;
  }
  .repo + .repo { margin-top: 4px; }
  .repo:hover { background: var(--surface); }
  .repo .rank { font: 13px var(--mono); color: var(--faint); text-align: right; }
  .repo .rname { font: 600 14px var(--mono); color: var(--fg); word-break: break-all; }
  .repo:hover .rname { color: var(--accent); }
  .repo .stars { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .repo .lang {
    font: 11px var(--mono); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px;
  }
  .repo .rdesc {
    grid-column: 2 / -1; font-size: 13.5px; color: var(--muted);
    word-break: break-word;
  }
  .note .plain {
    font-size: 14.5px; color: var(--muted); white-space: pre-wrap;
    word-break: break-word; padding: 4px 14px;
  }
  .note .tags { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .note .tag { font: 12px var(--mono); color: var(--faint); }
  .note .tag::before { content: "#"; margin-right: 1px; }

  #more {
    display: block; width: 100%; margin-top: 28px; padding: 11px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    color: var(--muted); font: 13px var(--mono); cursor: pointer;
    transition: border-color .12s, color .12s;
  }
  #more:hover { color: var(--fg); border-color: var(--muted); }

  .empty { color: var(--muted); padding: 48px 0; font-size: 14.5px; }

  footer {
    margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line);
    color: var(--faint); font: 12.5px var(--mono);
  }
  footer a { color: var(--faint); text-decoration: none; }
  footer a:hover { color: var(--fg); }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 8px 18px; border-radius: 8px;
    font-size: 14px; display: none; max-width: 90vw; z-index: 10;
  }

  @media (max-width: 520px) {
    .repo { grid-template-columns: 30px 1fr auto; }
    .repo .lang { grid-column: 3; }
    .repo .stars { grid-column: 3; grid-row: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">tscuite<em>.</em></div>
    <nav>
      <a href="https://github.com/tscuite">GitHub</a>
      <a href="/memory/">Memory_</a>
    </nav>
  </header>

  <div id="feed"></div>
  <div class="empty" id="empty" style="display:none">还没有公开笔记。写一条 namespace=public 的记忆，就会出现在这里。</div>
  <button id="more" style="display:none">加载更多</button>

  <footer>
    <a href="mailto:tscuite@agent.qq.com">tscuite@agent.qq.com</a>
  </footer>
</div>
<div id="toast"></div>

<script>
const ENDPOINT = "https://memory.tscuite.workers.dev";
const $ = (id) => document.getElementById(id);
let afterId = null;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => (t.style.display = "none"), 3500);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 识别 "owner/repo ★N・Lang" 行块，渲染为可点击项目卡；其余按纯文本
function renderContent(content) {
  const blocks = String(content || "").split(/\n{2,}/);
  const out = [];
  let rank = 0;
  for (const block of blocks) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    const m = lines.length >= 1
      ? lines[0].match(/^([A-Za-z0-9._-]+\/[A-Za-z0-9._-]+)\s*★\s*([\d,]+)\s*[・·]\s*(.+)$/)
      : null;
    if (m) {
      rank += 1;
      const desc = lines.slice(1).join(" ");
      out.push(`<a class="repo" href="https://github.com/${m[1]}" target="_blank" rel="noopener">
        <span class="rank">${String(rank).padStart(2, "0")}</span>
        <span class="rname">${escapeHtml(m[1])}</span>
        <span class="stars">★ ${m[2]}</span>
        <span class="lang">${escapeHtml(m[3])}</span>
        ${desc ? `<span class="rdesc">${escapeHtml(desc)}</span>` : ""}
      </a>`);
    } else {
      out.push(`<div class="plain">${escapeHtml(block)}</div>`);
    }
  }
  return out.join("");
}

function noteHtml(n) {
  const date = (n.created_at || "").slice(0, 10).replace(/-/g, ".");
  const tags = (n.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
  return `<article class="note">
    <div class="date">${date}</div>
    <h3>${escapeHtml(n.subject || "（无标题）")}</h3>
    ${renderContent(n.content)}
    ${tags ? `<div class="tags">${tags}</div>` : ""}
  </article>`;
}

async function load(append) {
  try {
    const p = new URLSearchParams({ limit: "10" });
    if (afterId) p.set("after_id", afterId);
    const res = await fetch(`${ENDPOINT}/api/public/memories?${p}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!append) $("feed").innerHTML = "";
    $("feed").insertAdjacentHTML("beforeend", (data.items || []).map(noteHtml).join(""));
    afterId = data.next_after_id;
    const total = $("feed").querySelectorAll(".note").length;
    $("more").style.display = data.next_after_id ? "block" : "none";
    $("empty").style.display = total ? "none" : "block";
    if (!total) $("empty").textContent = "还没有公开笔记。写一条 namespace=public 的记忆，就会出现在这里。";
  } catch (e) {
    toast("加载失败：" + e.message);
    $("empty").style.display = "block";
    $("empty").textContent = "笔记加载失败，稍后再试试。";
  }
}

$("more").onclick = () => load(true);
load(false);
</script>
</body>
</html>
