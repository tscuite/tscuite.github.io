<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tscuite</title>
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --fg: #111113;
    --muted: #6e6e76;
    --faint: #9c9ca4;
    --line: #e6e6e2;
    --line-strong: #d9d9d4;
    --accent: #e5484d;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0e;
      --surface: #151517;
      --fg: #ededef;
      --muted: #9d9da6;
      --faint: #6b6b73;
      --line: #232327;
      --line-strong: #303036;
      --accent: #ff6369;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: saturate(1.4) blur(12px);
    -webkit-backdrop-filter: saturate(1.4) blur(12px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 680px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .wordmark { font: 650 16px/1 var(--mono); letter-spacing: 0.02em; }
  .wordmark em { font-style: normal; color: var(--accent); }
  .wordmark .cursor {
    display: inline-block; width: 8px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: -2px;
    animation: blink 1.2s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  nav { display: flex; gap: 20px; }
  nav a {
    color: var(--muted); text-decoration: none; font: 13px var(--mono);
    transition: color .15s;
  }
  nav a:hover { color: var(--fg); }

  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 72px; }

  .note { margin-bottom: 36px; }
  .note-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .note-head .date {
    font: 12px var(--mono); color: var(--accent); letter-spacing: 0.06em;
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 8px;
  }
  .note-head h2 { font-size: 17px; font-weight: 650; letter-spacing: 0.01em; }

  .repo {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    grid-template-areas: "rank name stars" "rank desc lang";
    column-gap: 12px; row-gap: 2px;
    align-items: baseline;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 16px;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .repo + .repo { margin-top: 8px; }
  .repo:hover {
    border-color: var(--line-strong);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
  .repo .rank {
    grid-area: rank; font: 12px var(--mono); color: var(--faint);
    text-align: right;
  }
  .repo .rname {
    grid-area: name; font: 600 14px/1.3 var(--mono); color: var(--fg);
    word-break: break-all;
  }
  .repo:hover .rname { color: var(--accent); }
  .repo .rname .arrow { color: var(--faint); opacity: 0; transition: opacity .15s; }
  .repo:hover .rname .arrow { opacity: 1; }
  .repo .stars {
    grid-area: stars; justify-self: end;
    font: 12px var(--mono); color: var(--muted);
    background: color-mix(in srgb, var(--fg) 5%, transparent);
    border-radius: 6px; padding: 2px 8px;
  }
  .repo .lang {
    grid-area: lang; justify-self: end;
    display: flex; align-items: center; gap: 6px;
    font: 11.5px var(--mono); color: var(--muted);
  }
  .repo .dot { width: 8px; height: 8px; border-radius: 50%; }
  .repo .rdesc {
    grid-area: desc; grid-column: 2 / -1;
    font-size: 13.5px; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .note .plain {
    font-size: 14px; color: var(--muted); white-space: pre-wrap;
    word-break: break-word; padding: 4px 16px;
  }
  .note .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .note .tag {
    font: 11.5px var(--mono); color: var(--faint);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  }

  #more {
    display: block; width: 100%; padding: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    color: var(--muted); font: 13px var(--mono); cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  #more:hover { color: var(--fg); border-color: var(--line-strong); }

  .empty {
    text-align: center; padding: 64px 0; color: var(--faint);
    font: 13px var(--mono);
  }

  footer {
    max-width: 680px; margin: 0 auto; padding: 20px 20px 40px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    color: var(--faint); font: 12px var(--mono);
  }
  footer a { color: var(--faint); text-decoration: none; }
  footer a:hover { color: var(--fg); }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 9px 18px; border-radius: 10px;
    font-size: 13.5px; display: none; max-width: 90vw; z-index: 20;
    box-shadow: var(--shadow);
  }

  @media (prefers-reduced-motion: no-preference) {
    .note { animation: rise .45s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  }
  @media (max-width: 520px) {
    .repo { grid-template-columns: 26px 1fr auto; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="wordmark">tscuite<span class="cursor"></span></div>
    <nav>
      <a href="https://github.com/tscuite">GitHub</a>
      <a href="/memory/">Memory_</a>
    </nav>
  </div>
</header>

<main>
  <div id="feed"></div>
  <div class="empty" id="empty" style="display:none">还没有公开笔记。写一条 namespace=public 的记忆，就会出现在这里。</div>
  <button id="more" style="display:none">加载更多</button>
</main>

<footer>
  <span>© 2026 tscuite</span>
  <span>Cloudflare Workers · D1 · Vectorize</span>
  <a href="mailto:tscuite@agent.qq.com">tscuite@agent.qq.com</a>
</footer>
<div id="toast"></div>

<script>
const ENDPOINT = "https://memory.tscuite.workers.dev";
const $ = (id) => document.getElementById(id);
let afterId = null;

const LANG_COLORS = {
  "Python": "#3572A5", "Rust": "#dea584", "TypeScript": "#3178c6", "Go": "#00ADD8",
  "C++": "#f34b7d", "HTML": "#e34c26", "JavaScript": "#f1e05a", "Java": "#b07219",
  "C": "#555555", "C#": "#178600", "Shell": "#89e051", "Vue": "#41b883",
  "Kotlin": "#A97BFF", "Swift": "#F05138", "Ruby": "#701516", "Zig": "#ec915c",
};

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => (t.style.display = "none"), 3500);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderContent(content) {
  const blocks = String(content || "").split(/\n{2,}/);
  const out = [];
  let rank = 0;
  for (const block of blocks) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    const m = lines.length >= 1
      ? lines[0].match(/^([A-Za-z0-9._-]+\/[A-Za-z0-9._-]+)\s*★\s*([\d,]+)\s*[・·]\s*(.+)$/)
      : null;
    if (m) {
      rank += 1;
      const desc = lines.slice(1).join(" ");
      const dotColor = LANG_COLORS[m[3]] || "#8b8b93";
      out.push(`<a class="repo" href="https://github.com/${m[1]}" target="_blank" rel="noopener">
        <span class="rank">${String(rank).padStart(2, "0")}</span>
        <span class="rname">${escapeHtml(m[1])} <span class="arrow">↗</span></span>
        <span class="stars">★ ${m[2]}</span>
        <span class="lang"><i class="dot" style="background:${dotColor}"></i>${escapeHtml(m[3])}</span>
        ${desc ? `<span class="rdesc">${escapeHtml(desc)}</span>` : ""}
      </a>`);
    } else {
      out.push(`<div class="plain">${escapeHtml(block)}</div>`);
    }
  }
  return out.join("");
}

function noteHtml(n) {
  const date = (n.created_at || "").slice(0, 10).replace(/-/g, ".");
  const tags = (n.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
  return `<article class="note">
    <div class="note-head">
      <span class="date">${date}</span>
      <h2>${escapeHtml(n.subject || "（无标题）")}</h2>
    </div>
    ${renderContent(n.content)}
    ${tags ? `<div class="tags">${tags}</div>` : ""}
  </article>`;
}

async function load(append) {
  try {
    const p = new URLSearchParams({ limit: "10" });
    if (afterId) p.set("after_id", afterId);
    const res = await fetch(`${ENDPOINT}/api/public/memories?${p}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!append) $("feed").innerHTML = "";
    $("feed").insertAdjacentHTML("beforeend", (data.items || []).map(noteHtml).join(""));
    afterId = data.next_after_id;
    const total = $("feed").querySelectorAll(".note").length;
    $("more").style.display = data.next_after_id ? "block" : "none";
    $("empty").style.display = total ? "none" : "block";
    if (!total) $("empty").textContent = "还没有公开笔记。写一条 namespace=public 的记忆，就会出现在这里。";
  } catch (e) {
    toast("加载失败：" + e.message);
    $("empty").style.display = "block";
    $("empty").textContent = "笔记加载失败，稍后再试试。";
  }
}

$("more").onclick = () => load(true);
load(false);
</script>
</body>
</html>
