<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tscuite</title>
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --fg: #111113;
    --muted: #6e6e76;
    --faint: #9c9ca4;
    --line: #e6e6e2;
    --line-strong: #d9d9d4;
    --accent: #e5484d;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0e;
      --surface: #151517;
      --fg: #ededef;
      --muted: #9d9da6;
      --faint: #6b6b73;
      --line: #232327;
      --line-strong: #303036;
      --accent: #ff6369;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: saturate(1.4) blur(12px);
    -webkit-backdrop-filter: saturate(1.4) blur(12px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 720px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .wordmark { font: 650 16px/1 var(--mono); letter-spacing: 0.02em; }
  .wordmark .cursor {
    display: inline-block; width: 8px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: -2px;
    animation: blink 1.2s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  nav { display: flex; gap: 20px; }
  nav a { color: var(--muted); text-decoration: none; font: 13px var(--mono); transition: color .15s; }
  nav a:hover { color: var(--fg); }

  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 72px; }

  /* 仪表条：吃什么 + 周末倒计时 */
  .widgetbar {
    display: flex; align-items: stretch;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 20px; margin-bottom: 12px;
  }
  .wb-food { flex: 1.5; min-width: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .wb-food .food-emoji { font-size: 24px; line-height: 1; }
  .wb-food .food-name { font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
  .wb-food .w-title { margin-right: auto; }
  .wb-divider { width: 1px; background: var(--line); margin: 4px 22px; }
  .wb-weekend { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .wb-weekend .line { display: flex; align-items: baseline; gap: 8px; }
  .weekend-big { font: 700 24px/1 var(--mono); color: var(--accent); }
  .weekend-unit { font-size: 13px; color: var(--muted); }
  .weekend-sub { font: 11.5px var(--mono); color: var(--faint); }
  .w-title { font: 12px var(--mono); color: var(--faint); letter-spacing: 0.04em; }
  .w-btn {
    background: none; border: 1px solid var(--line-strong); color: var(--muted);
    font: 11.5px var(--mono); border-radius: 7px; padding: 4px 12px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .w-btn:hover { color: var(--fg); border-color: var(--muted); }
  .wb-food.rolling .food-name { color: var(--muted); }
  .wb-food.settled { animation: pop .35s ease; }
  @keyframes pop { 40% { transform: scale(1.02); } }
  .temp {
    position: fixed; z-index: 30; opacity: 0; pointer-events: none;
    transition: opacity .45s ease; color: var(--muted);
    font: 500 15px var(--mono); white-space: nowrap;
  }
  .temp.show { opacity: 1; }
  .temp.hide { opacity: 0; }

  /* 迷你组件行 */
  .minis { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 12px; margin-bottom: 40px; }
  .mini {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 16px; min-height: 74px;
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
  }
  .mini .val { font-size: 17px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini .hitokoto { font-size: 13.5px; color: var(--muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mini .from { font: 11px var(--mono); color: var(--faint); }

  /* GitHub 每日热门面板 */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px 14px; margin-bottom: 36px;
  }
  .panel-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .panel-head h2 { font-size: 15.5px; font-weight: 650; }
  .panel-head .date { font: 12px var(--mono); color: var(--faint); }
  .panel .repo {
    display: grid;
    grid-template-columns: 30px 1fr auto auto;
    grid-template-areas: "rank name stars lang";
    column-gap: 12px;
    align-items: baseline;
    text-decoration: none;
    padding: 9px 8px;
    border-radius: 8px;
    transition: background .12s;
  }
  .panel .repo:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
  .panel .repo .rank { grid-area: rank; font: 12px var(--mono); color: var(--faint); text-align: right; }
  .panel .repo .rname { grid-area: name; font: 600 13.5px/1.4 var(--mono); color: var(--fg); word-break: break-all; }
  .panel .repo:hover .rname { color: var(--accent); }
  .panel .repo .stars { grid-area: stars; font: 12px var(--mono); color: var(--muted); }
  .panel .repo .lang { grid-area: lang; font: 11.5px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .panel .dot { width: 8px; height: 8px; border-radius: 50%; }
  .panel .desc { grid-area: desc; }
  .expand-btn {
    display: block; width: 100%; margin-top: 6px; padding: 8px;
    background: none; border: none; color: var(--faint);
    font: 12px var(--mono); cursor: pointer;
  }
  .expand-btn:hover { color: var(--fg); }

  /* 笔记 */
  .note { margin-bottom: 32px; }
  .note-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .note-head .date {
    font: 12px var(--mono); color: var(--accent); letter-spacing: 0.06em;
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 8px;
  }
  .note-head h2 { font-size: 17px; font-weight: 650; letter-spacing: 0.01em; }
  .note .plain {
    font-size: 14px; color: var(--muted); white-space: pre-wrap;
    word-break: break-word; padding: 4px 16px;
  }
  .note .repo {
    display: grid;
    grid-template-columns: 34px 1fr auto auto;
    grid-template-areas: "rank name stars lang" "rank desc desc desc";
    column-gap: 12px; row-gap: 2px;
    align-items: baseline;
    text-decoration: none;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 16px;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .note .repo + .repo { margin-top: 8px; }
  .note .repo:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: var(--shadow); }
  .note .repo .rank { grid-area: rank; font: 12px var(--mono); color: var(--faint); text-align: right; }
  .note .repo .rname { grid-area: name; font: 600 14px/1.3 var(--mono); color: var(--fg); word-break: break-all; }
  .note .repo:hover .rname { color: var(--accent); }
  .note .repo .arrow { color: var(--faint); opacity: 0; transition: opacity .15s; }
  .note .repo:hover .arrow { opacity: 1; }
  .note .repo .stars {
    grid-area: stars; justify-self: end;
    font: 12px var(--mono); color: var(--muted);
    background: color-mix(in srgb, var(--fg) 5%, transparent);
    border-radius: 6px; padding: 2px 8px;
  }
  .note .repo .lang {
    grid-area: lang; justify-self: end;
    display: flex; align-items: center; gap: 6px;
    font: 11.5px var(--mono); color: var(--muted);
  }
  .note .repo .dot { width: 8px; height: 8px; border-radius: 50%; }
  .note .repo .rdesc {
    grid-area: desc;
    font-size: 13.5px; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .note .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .note .tag {
    font: 11.5px var(--mono); color: var(--faint);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  }

  #more {
    display: block; width: 100%; padding: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    color: var(--muted); font: 13px var(--mono); cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  #more:hover { color: var(--fg); border-color: var(--line-strong); }

  .empty { text-align: center; padding: 48px 0; color: var(--faint); font: 13px var(--mono); }

  footer {
    max-width: 720px; margin: 0 auto; padding: 20px 20px 40px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    color: var(--faint); font: 12px var(--mono);
  }
  footer a { color: var(--faint); text-decoration: none; }
  footer a:hover { color: var(--fg); }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 9px 18px; border-radius: 10px;
    font-size: 13.5px; display: none; max-width: 90vw; z-index: 40;
    box-shadow: var(--shadow);
  }

  /* 编辑吃什么清单 */
  dialog {
    border: 1px solid var(--line-strong); border-radius: 14px;
    background: var(--surface); color: var(--fg);
    padding: 20px; width: min(520px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { font-size: 15px; margin-bottom: 12px; }
  dialog textarea {
    width: 100%; height: 180px; resize: vertical;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--fg); font: 13px/1.7 var(--mono); padding: 10px 12px; outline: none;
  }
  dialog textarea:focus { border-color: var(--accent); }
  dialog input {
    width: 100%; margin-top: 10px; padding: 8px 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--fg); font: 13px var(--mono); outline: none;
  }
  dialog .dlg-hint { font: 11.5px var(--mono); color: var(--faint); margin-top: 8px; }
  dialog .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    font: 13px var(--mono); padding: 7px 16px; cursor: pointer;
  }

  @media (prefers-reduced-motion: no-preference) {
    .note, .panel, .minis, .widgetbar { animation: rise .45s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  }
  @media (max-width: 560px) {
    .widgetbar { flex-direction: column; gap: 14px; }
    .wb-divider { width: auto; height: 1px; margin: 2px 0; }
    .minis { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="wordmark">tscuite<span class="cursor"></span></div>
    <nav>
      <a href="https://github.com/tscuite">GitHub</a>
      <a href="/memory/">Memory_</a>
    </nav>
  </div>
</header>

<main>
  <section class="widgetbar">
    <div class="wb-food" id="foodBody">
      <span class="w-title" id="foodTitle">今天吃什么</span>
      <span class="food-emoji">🍚</span>
      <span class="food-name" id="foodName">……</span>
      <button class="w-btn" id="reroll">换一个</button>
      <button class="w-btn" id="foodEdit">编辑</button>
    </div>
    <div class="wb-divider"></div>
    <div class="wb-weekend">
      <span class="w-title">休息日倒计时</span>
      <div class="line">
        <span class="weekend-big" id="weekendDays">-</span>
        <span class="weekend-unit" id="weekendUnit"></span>
      </div>
      <span class="weekend-sub" id="weekendSub"></span>
    </div>
  </section>

  <section class="minis">
    <div class="mini">
      <span class="w-title">北京天气</span>
      <span class="val" id="weather">加载中…</span>
    </div>
    <div class="mini">
      <span class="w-title">一言</span>
      <span class="hitokoto" id="hitokoto">加载中…</span>
      <span class="from" id="hitokotoFrom"></span>
    </div>
    <div class="mini">
      <span class="w-title" id="holidayTitle">距离国庆</span>
      <span class="val" id="holidayVal">-</span>
    </div>
  </section>

  <div id="trending"></div>
  <div id="feed"></div>
  <div class="empty" id="empty" style="display:none">还没有公开笔记。写一条 namespace=public 的记忆，就会出现在这里。</div>
  <button id="more" style="display:none">加载更多</button>
</main>

<footer>
  <span>© 2026 tscuite</span>
  <span>Cloudflare Workers · D1 · Vectorize</span>
  <a href="mailto:tscuite@agent.qq.com">tscuite@agent.qq.com</a>
</footer>

<dialog id="foodDialog">
  <h3>编辑吃什么清单</h3>
  <textarea id="foodListText" placeholder="空格或换行分隔，比如：麻辣烫 火锅 面条"></textarea>
  <input id="secretInput" type="password" placeholder="API_SECRET（保存需要，与 Memory 控制台同一个）" autocomplete="off">
  <div class="dlg-hint">密钥只保存在你本机浏览器，用于本地签名，不会发给任何服务器。</div>
  <div class="dlg-actions">
    <button class="w-btn" id="foodCancel">取消</button>
    <button class="btn-primary" id="foodSave">保存</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
const ENDPOINT = localStorage.getItem("mem_console_endpoint") || "https://memory.tscuite.workers.dev";
const LS_SECRET = "mem_console_secret";
const $ = (id) => document.getElementById(id);
let afterId = null;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => (t.style.display = "none"), 3500);
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const LANG_COLORS = {
  "Python": "#3572A5", "Rust": "#dea584", "TypeScript": "#3178c6", "Go": "#00ADD8",
  "C++": "#f34b7d", "HTML": "#e34c26", "JavaScript": "#f1e05a", "Java": "#b07219",
  "C": "#555555", "C#": "#178600", "Shell": "#89e051", "Vue": "#41b883",
  "Kotlin": "#A97BFF", "Swift": "#F05138", "Ruby": "#701516", "Zig": "#ec915c",
};
const REPO_LINE = /^([A-Za-z0-9._-]+\/[A-Za-z0-9._-]+)\s*★\s*([\d,]+)\s*[・·]\s*(.+)$/;

function repoRowHtml(m, rank) {
  const dotColor = LANG_COLORS[m[3]] || "#8b8b93";
  return `<a class="repo" href="https://github.com/${m[1]}" target="_blank" rel="noopener">
    <span class="rank">${String(rank).padStart(2, "0")}</span>
    <span class="rname">${escapeHtml(m[1])}</span>
    <span class="stars">★ ${m[2]}</span>
    <span class="lang"><i class="dot" style="background:${dotColor}"></i>${escapeHtml(m[3])}</span>
  </a>`;
}

// ---- 吃什么：清单来自 worker 配置，可编辑 ----
const FALLBACK_FOODS = ["麻辣烫", "火锅", "面条", "黄焖鸡", "沙拉", "不吃"];
let FOODS = FALLBACK_FOODS;
async function loadFoods() {
  try {
    const res = await fetch(`${ENDPOINT}/api/public/config/foods`);
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data.foods) && data.foods.length) FOODS = data.foods;
    }
  } catch { /* 用默认清单 */ }
  showFood(daySeed());
}
function daySeed() {
  const d = new Date();
  const s = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  let h = 0;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h;
}
function showFood(i) { $("foodName").textContent = FOODS[i % FOODS.length]; }
function scatter(word) {
  const span = document.createElement("span");
  span.className = "temp";
  span.textContent = word;
  span.style.top = Math.random() * (innerHeight - 48) + "px";
  span.style.left = Math.random() * Math.max(60, innerWidth - 120) + "px";
  span.style.fontSize = 14 + Math.random() * 22 + "px";
  document.body.appendChild(span);
  requestAnimationFrame(() => span.classList.add("show"));
  setTimeout(() => {
    span.classList.add("hide");
    setTimeout(() => span.remove(), 600);
  }, 600 + Math.random() * 400);
}
let rolling = false;
$("reroll").onclick = () => {
  if (rolling) return;
  rolling = true;
  const body = $("foodBody");
  const title = $("foodTitle");
  body.classList.add("rolling");
  title.textContent = "吃什么？";
  let tick = 0;
  const timer = setInterval(() => {
    const word = FOODS[Math.floor(Math.random() * FOODS.length)];
    $("foodName").textContent = word;
    scatter(word);
    if (++tick > 16) {
      clearInterval(timer);
      rolling = false;
      body.classList.remove("rolling");
      body.classList.remove("settled");
      void body.offsetWidth;
      body.classList.add("settled");
      title.textContent = "就吃这个！";
    }
  }, 50);
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !$("foodDialog").open) $("reroll").click();
});

// 编辑清单：读 worker 配置，PUT 回写（HMAC 签名）
async function sha256Hex(str) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function sign(method, pathWithQuery, body) {
  const secret = localStorage.getItem(LS_SECRET) || "";
  const ts = String(Math.floor(Date.now() / 1000));
  const nonce = crypto.randomUUID().replace(/-/g, "");
  const canonical = `${method}\n${pathWithQuery}\n${ts}\n${nonce}\n${body ? await sha256Hex(body) : "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"}`;
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret),
    { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(canonical));
  return {
    "X-Auth-Timestamp": ts,
    "X-Auth-Nonce": nonce,
    "X-Auth-Signature": [...new Uint8Array(sig)].map((b) => b.toString(16).padStart(2, "0")).join(""),
  };
}
$("foodEdit").onclick = () => {
  $("foodListText").value = FOODS.join(" ");
  if (!localStorage.getItem(LS_SECRET)) $("secretInput").value = "";
  $("foodDialog").showModal();
};
$("foodCancel").onclick = () => $("foodDialog").close();
$("foodSave").onclick = async () => {
  const raw = $("foodListText").value.split(/\s+/).map((s) => s.trim()).filter(Boolean);
  if (!raw.length) return toast("清单不能为空");
  const secret = $("secretInput").value.trim();
  if (secret) localStorage.setItem(LS_SECRET, secret);
  if (!localStorage.getItem(LS_SECRET)) return toast("先填 API_SECRET");
  const body = JSON.stringify({ foods: raw });
  try {
    const res = await fetch(`${ENDPOINT}/api/config/foods`, {
      method: "PUT", body,
      headers: { "Content-Type": "application/json", ...(await sign("PUT", "/api/config/foods", body)) },
    });
    if (res.status === 401) throw new Error("密钥不对");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    FOODS = raw;
    $("foodDialog").close();
    toast(`已保存 ${raw.length} 个选项`);
  } catch (e) {
    toast("保存失败：" + e.message);
  }
};

// ---- 休息日倒计时 + 节假日（国务院调休表，worker 缓存，无数据时退化为周末计算） ----
function dayIso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dayParse(s) { return new Date(s + "T00:00:00+08:00"); }
function dayDiff(a, b) { return Math.round((a - b) / 86400000); }

async function initRestday() {
  let years = {};
  try {
    const res = await fetch(`${ENDPOINT}/api/public/config/holidays`);
    if (res.ok) years = (await res.json()).Years || {};
  } catch { /* 无数据：只按周末算 */ }
  const list = years[String(new Date().getFullYear())] || [];
  const today = new Date(); today.setHours(0, 0, 0, 0);

  // 某天是否休息日：补班优先，其次假期段，其次周末；返回 false 或 { name }
  const restInfo = (d) => {
    const di = dayIso(d);
    for (const h of list) {
      if ((h.CompDays || []).includes(di)) return false;
      if (d >= dayParse(h.StartDate) && d <= dayParse(h.EndDate)) return { name: h.Name };
    }
    const dow = d.getDay();
    return dow === 6 || dow === 0 ? { name: null } : false;
  };

  // 休息日倒计时条
  const nowRest = restInfo(today);
  if (nowRest) {
    let left = 0;
    for (const h of list) {
      if (today >= dayParse(h.StartDate) && today <= dayParse(h.EndDate)) {
        left = dayDiff(dayParse(h.EndDate), today);
        break;
      }
    }
    $("weekendDays").textContent = "🎉";
    $("weekendUnit").textContent = nowRest.name ? `${nowRest.name}假期中` : "周末快乐";
    $("weekendSub").textContent = nowRest.name && left > 0 ? `还有 ${left} 天假` : "好好休息";
  } else {
    let d = new Date(today);
    for (let i = 1; i <= 45; i++) {
      d = new Date(d.getTime() + 86400000);
      const r = restInfo(d);
      if (r) {
        const days = dayDiff(d, today);
        $("weekendDays").textContent = days;
        $("weekendUnit").textContent = r.name && d.getDay() < 6 ? `天后「${r.name}」` : "天后是周末";
        $("weekendSub").textContent = `${dayIso(d).replace(/-/g, ".")} ${d.getDay() === 6 ? "周六" : d.getDay() === 0 ? "周日" : r.name || "假期"}`;
        break;
      }
    }
  }

  // 节假日小卡片
  let inHoliday = null;
  for (const h of list) {
    if (today >= dayParse(h.StartDate) && today <= dayParse(h.EndDate) && !(h.CompDays || []).includes(dayIso(today))) {
      inHoliday = h;
      break;
    }
  }
  if (inHoliday) {
    $("holidayTitle").textContent = inHoliday.Name;
    $("holidayVal").textContent = "假期中 🎉";
  } else {
    let next = null;
    for (const h of list) {
      const s = dayParse(h.StartDate);
      if (s > today && (!next || s < dayParse(next.StartDate))) next = h;
    }
    if (next) {
      const days = dayDiff(dayParse(next.StartDate), today);
      $("holidayTitle").textContent = `距离${next.Name}`;
      $("holidayVal").textContent = `${days} 天`;
    } else {
      const ny = new Date(today.getFullYear() + 1, 0, 1);
      $("holidayTitle").textContent = "距离元旦";
      $("holidayVal").textContent = `${dayDiff(ny, today)} 天`;
    }
  }
}

// ---- 笔记流：trending 标签的进独立面板，其余进笔记流 ----
function renderContent(content) {
  const blocks = String(content || "").split(/\n{2,}/);
  const out = [];
  let rank = 0;
  for (const block of blocks) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    const m = lines.length >= 1 ? lines[0].match(REPO_LINE) : null;
    if (m) {
      rank += 1;
      const desc = lines.slice(1).join(" ");
      const dotColor = LANG_COLORS[m[3]] || "#8b8b93";
      out.push(`<a class="repo" href="https://github.com/${m[1]}" target="_blank" rel="noopener">
        <span class="rank">${String(rank).padStart(2, "0")}</span>
        <span class="rname">${escapeHtml(m[1])} <span class="arrow">↗</span></span>
        <span class="stars">★ ${m[2]}</span>
        <span class="lang"><i class="dot" style="background:${dotColor}"></i>${escapeHtml(m[3])}</span>
        ${desc ? `<span class="rdesc">${escapeHtml(desc)}</span>` : ""}
      </a>`);
    } else {
      out.push(`<div class="plain">${escapeHtml(block)}</div>`);
    }
  }
  return out.join("");
}

function noteHtml(n) {
  const date = (n.created_at || "").slice(0, 10).replace(/-/g, ".");
  const tags = (n.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
  return `<article class="note">
    <div class="note-head">
      <span class="date">${date}</span>
      <h2>${escapeHtml(n.subject || "（无标题）")}</h2>
    </div>
    ${renderContent(n.content)}
    ${tags ? `<div class="tags">${tags}</div>` : ""}
  </article>`;
}

function trendingHtml(item) {
  const date = (item.created_at || "").slice(0, 10).replace(/-/g, ".");
  const blocks = String(item.content || "").split(/\n{2,}/);
  const rows = [];
  let rank = 0;
  for (const block of blocks) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    const m = lines[0]?.match(REPO_LINE);
    if (m) rows.push(repoRowHtml(m, ++rank));
  }
  if (!rows.length) return "";
  const hidden = rows.slice(5).join("");
  const visible = rows.slice(0, 5).join("");
  const moreBtn = rows.length > 5
    ? `<button class="expand-btn" data-expand="trendingMore">展开全部 ${rows.length} 个 ▾</button>` : "";
  return `<section class="panel" id="trendingPanel">
    <div class="panel-head">
      <h2>GitHub 每日热门</h2>
      <span class="date">${date}</span>
    </div>
    ${visible}
    <div id="trendingMore" style="display:none">${hidden}</div>
    ${moreBtn}
  </section>`;
}

async function load(append) {
  try {
    const p = new URLSearchParams({ limit: "10" });
    if (afterId) p.set("after_id", afterId);
    const res = await fetch(`${ENDPOINT}/api/public/memories?${p}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const items = data.items || [];

    // trending 拆出来（只在首屏渲染一次）
    if (!append) {
      const trending = items.filter((i) => (i.tags || []).includes("trending"));
      const notes = items.filter((i) => !(i.tags || []).includes("trending"));
      $("trending").innerHTML = trending.map(trendingHtml).join("");
      $("feed").innerHTML = notes.map(noteHtml).join("");
    } else {
      $("feed").insertAdjacentHTML("beforeend", items.filter((i) => !(i.tags || []).includes("trending")).map(noteHtml).join(""));
    }

    afterId = data.next_after_id;
    const total = $("feed").querySelectorAll(".note").length;
    $("more").style.display = data.next_after_id ? "block" : "none";
    $("empty").style.display = total ? "none" : "block";
    if (!total) $("empty").textContent = "还没有公开笔记。写一条 namespace=public 的记忆，就会出现在这里。";
  } catch (e) {
    toast("加载失败：" + e.message);
    $("empty").style.display = "block";
    $("empty").textContent = "笔记加载失败，稍后再试试。";
  }
}

$("more").onclick = () => load(true);
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-expand]");
  if (!btn) return;
  const target = $(btn.dataset.expand);
  target.style.display = target.style.display === "none" ? "" : "none";
  btn.textContent = target.style.display === "none" ? `展开全部 ${btn.textContent.match(/\d+/)?.[0] ?? ""} 个 ▾` : "收起 ▴";
});
load(false);
