<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>记忆 · tscuite</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('desk-theme') || 'light'; } catch { document.documentElement.dataset.theme = 'light'; }</script>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/desk.css">
  <link rel="stylesheet" href="/assets/memory.css">
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></symbol>
</defs></svg>
<header class="topbar">
  <a class="brand" href="/" aria-label="回到小桌面"><span class="brand-mark">t.</span><span>tscuite</span></a>
  <nav aria-label="站点导航">
    <a href="/">日常</a>
    <a class="nav-active" href="/memory/" aria-current="page">记忆</a>
    <a href="https://github.com/tscuite" target="_blank" rel="noopener noreferrer">GitHub <svg class="icon small" aria-hidden="true"><use href="#i-arrow"/></svg></a>
  </nav>
  <button class="user-chip" id="userNav" hidden>登录</button>
  <button class="icon-button" id="themeToggle" aria-label="切换深色模式" title="切换深色模式"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></button>
</header>
<div class="mem-wrap">
  <div id="setup">
    <div class="setup-card">
      <h1>MEMORY_</h1>
      <p>用你的账号登录。管理员可见全部记忆，普通用户仅公开内容。</p>
      <label for="email">邮箱</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <br><br>
      <button class="primary" id="connect">登录</button>
      <p class="field-hint" style="text-align:center">没有账号？找 tscuite 开通，页面没有注册入口。</p>
    </div>
  </div>

  <div id="app" hidden>
    <div class="mode-banner" id="modeBanner"></div>
    <div id="adminUi" hidden>
      <div class="mem-search">
        <input id="q" placeholder="搜索记忆…（≥3 字走语义检索，/ 聚焦）" autocomplete="off">
      </div>
      <div class="filters" id="targetFilter"></div>
      <div class="filters" id="horizonFilter"></div>
    </div>
    <div class="mem-list" id="list"></div>
    <button id="more" hidden>加载更多</button>
    <div class="empty" id="empty" hidden>没有匹配的记忆</div>
  </div>
</div>

<div id="drawer"><div class="drawer-panel" id="drawerPanel"></div></div>

<dialog id="accountDialog" aria-labelledby="accountDialogTitle">
  <form id="accountForm">
    <div class="dialog-heading"><h2 id="accountDialogTitle">账号</h2><button type="button" id="accountClose" class="icon-button" aria-label="关闭账号面板">×</button></div>
    <p class="account-line"><span>邮箱</span><b id="accountEmail"></b></p>
    <p class="account-line"><span>身份</span><span class="role-badge" id="accountRole"></span></p>
    <div class="dialog-actions"><button type="button" id="logoutBtn" class="text-button">退出登录</button><button class="primary" id="accountOk" type="button">知道了</button></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module">
import { api, storeSessionToken, clearSessionToken } from "/assets/api.mjs";
const $ = (id) => document.getElementById(id);

const TARGETS = [
  ["", "全部"], ["memory", "memory"], ["user", "user"], ["failure", "failure"],
];
const HORIZONS = [
  ["", "全部周期"], ["daily", "daily"], ["weekly", "weekly"],
  ["monthly", "monthly"], ["permanent", "permanent"],
];

let me = null;
let state = { target: "", horizons: [], q: "", afterId: null, loading: false };
let activeRequest;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  setTimeout(() => { t.hidden = true; }, 3500);
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function relTime(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso.replace(" ", "T") + "Z").getTime()) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)} 天前`;
  return iso.slice(0, 10);
}

function cardHtml(m) {
  const tags = (m.tags || []).slice(0, 3).map((t) => `<span class="badge">#${escapeHtml(t)}</span>`).join("");
  const cat = m.category ? `<span class="badge">${escapeHtml(m.category)}</span>` : "";
  return `<div class="mem-card${me.isAdmin ? " clickable" : ""}" data-id="${m.id}">
    <h3>${escapeHtml(m.subject || "（无标题）")}</h3>
    <div class="${me.isAdmin ? "snippet" : "full"}">${escapeHtml(m.content || "")}</div>
    <div class="meta">
      <span class="badge ${escapeHtml(m.target || "")}">${escapeHtml(m.target || "memory")}</span>
      <span class="badge">${escapeHtml(m.horizon || "daily")}</span>
      ${cat}${tags}
      <span class="time" title="${escapeHtml(m.created_at || "")}">${relTime(m.created_at)}</span>
    </div>
  </div>`;
}

async function loadAdmin(append) {
  if (append && state.loading) return;
  activeRequest?.abort();
  const controller = new AbortController();
  activeRequest = controller;
  state.loading = true;
  try {
    let data;
    if (state.q.trim().length >= 3) {
      const body = JSON.stringify({ q: state.q.trim(), target: state.target || null, horizons: state.horizons, limit: 20, bump_reference: false });
      data = await api("/api/memories/query", { method: "POST", body, signal: controller.signal });
    } else {
      const p = new URLSearchParams({ limit: "20", namespace: "default" });
      if (state.target) p.set("target", state.target);
      state.horizons.forEach((h) => p.append("horizon", h));
      if (append && state.afterId) p.set("after_id", state.afterId);
      data = await api("/api/memories?" + p.toString(), { signal: controller.signal });
    }
    if (controller.signal.aborted) return;
    const items = data.items || [];
    if (!append) $("list").innerHTML = "";
    $("list").insertAdjacentHTML("beforeend", items.map(cardHtml).join(""));
    state.afterId = state.q.trim().length >= 3 ? null : data.next_after_id;
    $("more").hidden = !state.afterId;
    $("empty").hidden = $("list").children.length > 0;
  } catch (e) {
    if (controller.signal.aborted) return;
    toast(e.message);
  } finally {
    if (activeRequest === controller) state.loading = false;
  }
}

async function loadPublic(append) {
  if (append && state.loading) return;
  activeRequest?.abort();
  const controller = new AbortController();
  activeRequest = controller;
  state.loading = true;
  try {
    const p = new URLSearchParams({ limit: "20" });
    if (append && state.afterId) p.set("after_id", state.afterId);
    const data = await api("/api/public/memories?" + p.toString(), { signal: controller.signal });
    if (controller.signal.aborted) return;
    const items = data.items || [];
    if (!append) $("list").innerHTML = "";
    $("list").insertAdjacentHTML("beforeend", items.map(cardHtml).join(""));
    state.afterId = data.next_after_id;
    $("more").hidden = !state.afterId;
    $("empty").hidden = $("list").children.length > 0;
    if (!$("list").children.length) $("empty").textContent = "还没有公开内容";
  } catch (e) {
    if (controller.signal.aborted) return;
    toast(e.message);
  } finally {
    if (activeRequest === controller) state.loading = false;
  }
}

const load = (append) => (me.isAdmin ? loadAdmin(append) : loadPublic(append));

async function openDetail(id) {
  try {
    const { item: m } = await api(`/api/memories/${id}`);
    if (!m) throw new Error("记忆不存在");
    const tags = (m.tags || []).map((t) => `#${escapeHtml(t)}`).join(" ");
    const reason = m.failure_reason ? `<b>failure_reason</b><span>${escapeHtml(m.failure_reason)}</span>` : "";
    $("drawerPanel").innerHTML = `
      <button class="drawer-close" id="drawerClose" aria-label="关闭详情">×</button>
      <h2>${escapeHtml(m.subject || "（无标题）")}</h2>
      <div class="content">${escapeHtml(m.content || "")}</div>
      <div class="kv">
        <b>id</b><span>${escapeHtml(m.id)}</span>
        <b>target</b><span>${escapeHtml(m.target || "-")}</span>
        <b>category</b><span>${escapeHtml(m.category || "-")}</span>
        <b>horizon</b><span>${escapeHtml(m.horizon || "-")}</span>
        <b>namespace</b><span>${escapeHtml(m.namespace || "-")} / ${escapeHtml(m.scope || "-")}</span>
        <b>created</b><span>${escapeHtml(m.created_at || "-")}</span>
        <b>tags</b><span>${tags || "-"}</span>
        ${reason}
      </div>`;
    $("drawerClose").onclick = closeDrawer;
    $("drawer").classList.add("open");
  } catch (e) { toast(e.message); }
}
function closeDrawer() { $("drawer").classList.remove("open"); }

function renderChips(container, options, active, key) {
  container.innerHTML = options.map(([v, label]) =>
    `<button class="chip ${((Array.isArray(active) ? active.includes(v) : active === v) || (v === "" && active.length === 0)) ? "on" : ""}" data-v="${v}">${label}</button>`).join("");
  container.onclick = (e) => {
    const v = e.target.dataset.v;
    if (v === undefined) return;
    if (key === "target") state.target = v;
    else state.horizons = v === "" ? [] : (state.horizons.includes(v) ? state.horizons.filter((h) => h !== v) : [...state.horizons, v]);
    renderChips($("targetFilter"), TARGETS, state.target, "target");
    renderChips($("horizonFilter"), HORIZONS, state.horizons, "horizons");
    state.afterId = null; load(false);
  };
}

function renderUser() {
  $("userNav").hidden = !me;
  if (me) $("userNav").textContent = me.name || me.email;
}
function showApp() {
  $("setup").hidden = true;
  $("app").hidden = false;
  renderUser();
  $("modeBanner").textContent = me.isAdmin
    ? "管理员模式：可见全部记忆，搜索与筛选已开启"
    : "普通用户模式：仅公开内容，只读";
  $("adminUi").hidden = !me.isAdmin;
  if (me.isAdmin) {
    renderChips($("targetFilter"), TARGETS, state.target, "target");
    renderChips($("horizonFilter"), HORIZONS, state.horizons, "horizons");
  }
  load(false);
}
function showSetup() {
  activeRequest?.abort();
  clearSessionToken();
  me = null; $("list").replaceChildren(); closeDrawer();
  state.afterId = null;
  $("app").hidden = true; $("setup").hidden = false;
  renderUser();
}

function updateThemeButton() {
  const next = document.documentElement.dataset.theme === "dark" ? "浅色" : "深色";
  $("themeToggle").setAttribute("aria-label", `切换${next}模式`);
  $("themeToggle").title = `切换${next}模式`;
}
$("themeToggle").onclick = () => {
  const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("desk-theme", theme); } catch { /* 不阻断 */ }
  updateThemeButton();
};
updateThemeButton();

$("connect").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) return toast("填一下邮箱和密码");
  $("connect").disabled = true;
  try {
    const { user, token } = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    if (!user?.email) throw new Error("登录响应异常");
    if (token) storeSessionToken(token);
    me = user;
    $("password").value = "";
    showApp();
  } catch (e) {
    toast(e.message);
  } finally { $("connect").disabled = false; }
};

$("userNav").onclick = () => {
  $("accountEmail").textContent = me.email;
  $("accountRole").textContent = me.isAdmin ? "管理员" : "普通用户";
  $("accountRole").className = `role-badge${me.isAdmin ? " admin" : ""}`;
  $("accountDialog").showModal();
};
$("accountClose").onclick = () => $("accountDialog").close();
$("accountOk").onclick = () => $("accountDialog").close();
$("logoutBtn").onclick = async () => {
  try { await api("/api/auth/logout", { method: "POST", body: JSON.stringify({}) }); } catch { /* 会话已失效也没关系 */ }
  $("accountDialog").close();
  showSetup();
  toast("已退出登录");
};

$("more").onclick = () => load(true);
let debounce;
$("q").oninput = () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.q = $("q").value; state.afterId = null; load(false); }, 350);
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) && !$("app").hidden) { e.preventDefault(); $("q").focus(); }
});
document.addEventListener("click", (e) => {
  const card = e.target.closest(".mem-card.clickable");
  if (card) openDetail(card.dataset.id);
});
$("drawer").addEventListener("click", (e) => { if (e.target === $("drawer")) closeDrawer(); });

(async () => {
  try {
    const { user } = await api("/api/auth/me");
    if (user?.email) { me = user; showApp(); }
  } catch { /* 未登录 */ }
})();
</script>
</body>
</html>
