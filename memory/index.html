<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f1">
  <title>Memory · tscuite</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-QGiT4mojW1igQ/+5+mE0mRij50yeXXzpBB1eo0n8sO4='; style-src 'self'; img-src 'self' data:; connect-src 'self' https://memory.tscuite.workers.dev wss://memory.tscuite.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
  <script src="/assets/theme.js?v=3"></script>
  <script>document.documentElement.dataset.pending = '1';</script>
  <link rel="icon" href="/assets/mark.svg?v=5" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/desk.css?v=9">
  <link rel="stylesheet" href="/assets/memory.css?v=3">
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5 7a8 8 0 0 1 13-2l2 3M4 16l2 3a8 8 0 0 0 13-2"/></symbol>
</defs></svg>
<a class="skip" href="#memoryMain">跳到 Memory 内容</a>
<header class="topbar">
  <a class="brand" href="/" aria-label="回到首页"><span class="brand-mark" aria-hidden="true">T</span><span>tscuite</span></a>
  <nav aria-label="站点导航">
    <a href="/">Daily</a>
    <a class="nav-active" href="/memory/" aria-current="page">Memory</a>
    <a href="https://github.com/tscuite" target="_blank" rel="noopener noreferrer">GitHub <svg class="icon small" aria-hidden="true"><use href="#i-arrow"/></svg></a>
  </nav>
  <button class="user-chip" id="userNav" hidden>登录</button>
  <button class="icon-button" id="themeToggle" aria-label="切换夜间模式" title="切换夜间模式"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button>
</header>
<div class="page">
  <section class="quote-strip" aria-label="每日一言">
    <time id="todayDate"></time>
    <span class="strip-sep" aria-hidden="true"></span>
    <blockquote id="hitokoto"></blockquote>
    <span class="quote-from" id="hitokotoFrom"></span>
  </section>
  <main class="mem-main" id="memoryMain">
    <p class="state-message" id="authLoading" hidden>正在连接…</p>
    <div id="setup">
      <div class="setup-card">
        <h1>登录 Memory</h1>
        <p>管理员可见全部记忆，普通用户仅公开内容。</p>
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="密码" autocomplete="current-password">
        <br><br>
        <button class="primary" id="connect">登录</button>
        <p class="field-hint">没有账号？找 tscuite 开通，页面没有注册入口。</p>
      </div>
    </div>

    <div id="app" hidden>
      <section class="card mem-panel">
        <div class="projects-heading">
          <div>
            <div class="title-line"><span class="section-symbol" aria-hidden="true">⌘</span><h1>Memory</h1></div>
            <div class="mem-mode" id="modeBanner"><span class="dot"></span><span>…</span></div>
          </div>
          <button class="icon-button" id="memReload" aria-label="重新读取记忆" title="重新读取"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
        </div>
        <div class="project-tools mem-tools" id="adminUi" hidden>
          <div class="mem-toolbar">
            <div class="filter-list" id="targetFilter"></div>
            <span class="tool-sep" aria-hidden="true"></span>
            <div class="filter-list" id="horizonFilter"></div>
          </div>
          <label class="search"><svg class="icon small" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" placeholder="搜索记忆…（≥3 字走语义检索，/ 聚焦）" autocomplete="off" aria-label="搜索记忆"></label>
        </div>
        <div class="mem-list" id="list"></div>
        <p class="state-message" id="empty" hidden>没有匹配的记忆</p>
        <div class="projects-footer"><span id="memCount">还没有内容</span><span>管理员可看全部 · 普通用户仅公开</span></div>
      </section>
      <div class="feed-actions"><button class="text-button" id="more" hidden>加载更多</button></div>
      <section class="card feedback-panel" id="feedbackPanel" hidden>
        <form class="feedback-row" id="feedbackForm">
          <span class="fb-label">✎ 纠正记忆</span>
          <label class="search"><input id="feedbackInput" placeholder="说一句自然语言，自动修正或补充：其实我不喝咖啡，爱喝茶…" autocomplete="off" aria-label="纠正记忆"></label>
          <button class="primary" type="submit">纠正</button>
        </form>
      </section>
    </div>
  </main>
  <footer class="site-footer"><span>tscuite</span><a href="https://github.com/tscuite" target="_blank" rel="noopener noreferrer">在 GitHub 找到我 <svg class="icon small" aria-hidden="true"><use href="#i-arrow"/></svg></a></footer>
</div>

<div id="drawer"><div class="drawer-panel" id="drawerPanel"></div></div>

<dialog id="accountDialog" aria-labelledby="accountDialogTitle">
  <form id="accountForm">
    <div class="dialog-heading"><h2 id="accountDialogTitle">账号</h2><button type="button" id="accountClose" class="icon-button" aria-label="关闭账号面板">×</button></div>
    <p class="account-line"><span>邮箱</span><b id="accountEmail"></b></p>
    <p class="account-line"><span>身份</span><span class="role-badge" id="accountRole"></span></p>
    <div class="dialog-actions"><button type="button" id="logoutBtn" class="text-button">退出登录</button><button class="primary" id="accountOk" type="button">知道了</button></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="/assets/memory.mjs?v=1"></script>
</body>
</html>
