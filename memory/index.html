<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #14141a;
    --panel2: #181820;
    --border: #26262e;
    --fg: #e6e6ea;
    --muted: #8a8a94;
    --accent: #e0a63c;
    --mem: #6ea8ff;
    --user: #6fd08c;
    --fail: #ff7a7a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; gap: 12px; flex-wrap: wrap; }
  .wordmark { font: 700 22px/1 var(--mono); letter-spacing: 0.12em; }
  .wordmark span { color: var(--accent); }
  .header-actions { display: flex; align-items: center; gap: 14px; }
  .back-link { font: 12px var(--mono); color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--fg); }
  .secret-state { font: 12px var(--mono); color: var(--muted); cursor: pointer; border: none; background: none; }
  .secret-state:hover { color: var(--fg); }
  .mode-banner { font: 12px var(--mono); color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; padding: 8px 14px; margin-bottom: 18px; }
  .search-row { display: flex; gap: 10px; }
  #q {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    color: var(--fg); padding: 12px 16px; border-radius: 8px; font-size: 15px;
    outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #q::placeholder { color: #55555e; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 24px; }
  .chip {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .memories { display: grid; gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; transition: border-color .12s;
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: var(--accent); }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .snippet { color: var(--muted); font-size: 14px; white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .full { color: var(--fg); font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .card .meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .badge { font: 11px var(--mono); padding: 2px 8px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .badge.memory { color: var(--mem); border-color: #2a3a55; }
  .badge.user { color: var(--user); border-color: #24452f; }
  .badge.failure { color: var(--fail); border-color: #552a2a; }
  .time { font: 12px var(--mono); color: var(--muted); margin-left: auto; }
  #more {
    display: block; width: 100%; margin-top: 16px; padding: 10px;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #more:hover { color: var(--fg); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 14px; }
  /* 抽屉 */
  #drawer {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: flex-end; justify-content: center; z-index: 10;
  }
  #drawer.open { display: flex; }
  .drawer-panel {
    width: 100%; max-width: 760px; max-height: 82vh; overflow-y: auto;
    background: var(--panel2); border: 1px solid var(--border); border-bottom: none;
    border-radius: 14px 14px 0 0; padding: 24px;
  }
  .drawer-panel h2 { font-size: 18px; margin-bottom: 10px; }
  .drawer-panel .content { white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
  .kv { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; font: 12.5px var(--mono); color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  .kv b { color: var(--fg); font-weight: 500; }
  .drawer-close { float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .drawer-close:hover { color: var(--fg); }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--fail); color: #1a0505; padding: 8px 16px; border-radius: 8px;
    font-size: 14px; display: none; z-index: 20; max-width: 90vw;
  }
  /* 登录屏 */
  #setup { text-align: center; padding-top: 12vh; }
  #setup h1 { font: 700 26px var(--mono); letter-spacing: 0.12em; margin-bottom: 8px; }
  #setup p { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  #setup label { display: block; font: 12px var(--mono); color: var(--muted); margin: 10px auto 4px; width: min(420px, 90%); text-align: left; }
  #setup input {
    width: min(420px, 90%); display: block; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    padding: 12px 16px; border-radius: 8px; font: 14px var(--mono); outline: none;
  }
  #setup input:focus { border-color: var(--accent); }
  #setup button {
    background: var(--accent); color: var(--bg); border: none; font-weight: 600;
    padding: 11px 40px; border-radius: 8px; font-size: 15px; cursor: pointer;
    margin-top: 20px;
  }
  .hint { color: #55555e; font-size: 12.5px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">MEMORY<span>_</span></div>
    <div class="header-actions">
      <a class="back-link" href="/">返回小桌面</a>
      <button class="secret-state" id="secretState" title="退出登录"></button>
    </div>
  </header>

  <div id="setup">
    <h1>MEMORY_</h1>
    <p>用你的账号登录。管理员可见全部记忆，普通用户仅公开内容。</p>
    <label for="email">邮箱</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <br>
    <button id="connect">登录</button>
    <p class="hint">没有账号？找 tscuite 开通，页面没有注册入口。</p>
  </div>

  <div id="app" style="display:none">
    <div class="mode-banner" id="modeBanner"></div>
    <div id="adminUi" style="display:none">
      <div class="search-row">
        <input id="q" placeholder="搜索记忆…（≥3 字走语义检索，/ 聚焦）" autocomplete="off">
      </div>
      <div class="filters" id="targetFilter"></div>
      <div class="filters" id="horizonFilter"></div>
    </div>
    <div class="memories" id="list"></div>
    <button id="more" style="display:none">加载更多</button>
    <div class="empty" id="empty" style="display:none">没有匹配的记忆</div>
  </div>
</div>

<div id="drawer"><div class="drawer-panel" id="drawerPanel"></div></div>
<div id="toast"></div>

<script type="module">
import { api, storeSessionToken, clearSessionToken } from "/assets/api.mjs";
const $ = (id) => document.getElementById(id);

const TARGETS = [
  ["", "全部"], ["memory", "memory"], ["user", "user"], ["failure", "failure"],
];
const HORIZONS = [
  ["", "全部周期"], ["daily", "daily"], ["weekly", "weekly"],
  ["monthly", "monthly"], ["permanent", "permanent"],
];

let me = null; // { email, name, isAdmin }
let state = { target: "", horizons: [], q: "", afterId: null, loading: false };
let activeRequest;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => (t.style.display = "none"), 3500);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function relTime(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso.replace(" ", "T") + "Z").getTime()) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)} 天前`;
  return iso.slice(0, 10);
}

function cardHtml(m) {
  const tags = (m.tags || []).slice(0, 3).map((t) => `<span class="badge">#${escapeHtml(t)}</span>`).join("");
  const cat = m.category ? `<span class="badge">${escapeHtml(m.category)}</span>` : "";
  return `<div class="card${me.isAdmin ? " clickable" : ""}" data-id="${m.id}">
    <h3>${escapeHtml(m.subject || "（无标题）")}</h3>
    <div class="${me.isAdmin ? "snippet" : "full"}">${escapeHtml(m.content || "")}</div>
    <div class="meta">
      <span class="badge ${escapeHtml(m.target || "")}">${escapeHtml(m.target || "memory")}</span>
      <span class="badge">${escapeHtml(m.horizon || "daily")}</span>
      ${cat}${tags}
      <span class="time" title="${escapeHtml(m.created_at || "")}">${relTime(m.created_at)}</span>
    </div>
  </div>`;
}

async function loadAdmin(append) {
  if (append && state.loading) return;
  activeRequest?.abort();
  const controller = new AbortController();
  activeRequest = controller;
  state.loading = true;
  try {
    let data;
    if (state.q.trim().length >= 3) {
      const body = JSON.stringify({
        q: state.q.trim(), target: state.target || null,
        horizons: state.horizons, limit: 20, bump_reference: false,
      });
      data = await api("/api/memories/query", { method: "POST", body, signal: controller.signal });
    } else {
      const p = new URLSearchParams({ limit: "20", namespace: "default" });
      if (state.target) p.set("target", state.target);
      state.horizons.forEach((h) => p.append("horizon", h));
      if (append && state.afterId) p.set("after_id", state.afterId);
      data = await api("/api/memories?" + p.toString(), { signal: controller.signal });
    }
    if (controller.signal.aborted) return;
    const items = data.items || [];
    if (!append) $("list").innerHTML = "";
    $("list").insertAdjacentHTML("beforeend", items.map(cardHtml).join(""));
    state.afterId = state.q.trim().length >= 3 ? null : data.next_after_id;
    $("more").style.display = state.afterId ? "block" : "none";
    $("empty").style.display = $("list").children.length ? "none" : "block";
  } catch (e) {
    if (controller.signal.aborted) return;
    toast(e.message);
  } finally {
    if (activeRequest === controller) state.loading = false;
  }
}

async function loadPublic(append) {
  if (append && state.loading) return;
  activeRequest?.abort();
  const controller = new AbortController();
  activeRequest = controller;
  state.loading = true;
  try {
    const p = new URLSearchParams({ limit: "20" });
    if (append && state.afterId) p.set("after_id", state.afterId);
    const data = await api("/api/public/memories?" + p.toString(), { signal: controller.signal });
    if (controller.signal.aborted) return;
    const items = data.items || [];
    if (!append) $("list").innerHTML = "";
    $("list").insertAdjacentHTML("beforeend", items.map(cardHtml).join(""));
    state.afterId = data.next_after_id;
    $("more").style.display = state.afterId ? "block" : "none";
    $("empty").style.display = $("list").children.length ? "none" : "block";
    if (!$("list").children.length) $("empty").textContent = "还没有公开内容";
  } catch (e) {
    if (controller.signal.aborted) return;
    toast(e.message);
  } finally {
    if (activeRequest === controller) state.loading = false;
  }
}

function load(append) {
  return me.isAdmin ? loadAdmin(append) : loadPublic(append);
}

async function openDetail(id) {
  try {
    const { item: m } = await api(`/api/memories/${id}`);
    if (!m) throw new Error("记忆不存在");
    const tags = (m.tags || []).map((t) => `#${escapeHtml(t)}`).join(" ");
    const reason = m.failure_reason ? `<b>failure_reason</b><span>${escapeHtml(m.failure_reason)}</span>` : "";
    $("drawerPanel").innerHTML = `
      <button class="drawer-close" id="drawerClose" aria-label="关闭详情">×</button>
      <h2>${escapeHtml(m.subject || "（无标题）")}</h2>
      <div class="content">${escapeHtml(m.content || "")}</div>
      <div class="kv">
        <b>id</b><span>${escapeHtml(m.id)}</span>
        <b>target</b><span>${escapeHtml(m.target || "-")}</span>
        <b>category</b><span>${escapeHtml(m.category || "-")}</span>
        <b>horizon</b><span>${escapeHtml(m.horizon || "-")}</span>
        <b>namespace</b><span>${escapeHtml(m.namespace || "-")} / ${escapeHtml(m.scope || "-")}</span>
        <b>created</b><span>${escapeHtml(m.created_at || "-")}</span>
        <b>tags</b><span>${tags || "-"}</span>
        ${reason}
      </div>`;
    $("drawerClose").onclick = closeDrawer;
    $("drawer").classList.add("open");
  } catch (e) { toast(e.message); }
}
function closeDrawer() { $("drawer").classList.remove("open"); }

function renderChips(container, options, active, key) {
  container.innerHTML = options.map(([v, label]) =>
    `<button class="chip ${((Array.isArray(active) ? active.includes(v) : active === v) || (v === "" && active.length === 0)) ? "on" : ""}" data-v="${v}">${label}</button>`).join("");
  container.onclick = (e) => {
    const v = e.target.dataset.v;
    if (v === undefined) return;
    if (key === "target") state.target = v;
    else state.horizons = v === "" ? [] : (state.horizons.includes(v) ? state.horizons.filter((h) => h !== v) : [...state.horizons, v]);
    renderChips($("targetFilter"), TARGETS, state.target, "target");
    renderChips($("horizonFilter"), HORIZONS, state.horizons, "horizons");
    state.afterId = null; load(false);
  };
}

function showApp() {
  $("setup").style.display = "none";
  $("app").style.display = "block";
  $("secretState").textContent = `${me.email} · 退出`;
  $("modeBanner").textContent = me.isAdmin
    ? "管理员模式：可见全部记忆，搜索与筛选已开启"
    : "普通用户模式：仅公开内容，只读";
  $("adminUi").style.display = me.isAdmin ? "block" : "none";
  if (me.isAdmin) {
    renderChips($("targetFilter"), TARGETS, state.target, "target");
    renderChips($("horizonFilter"), HORIZONS, state.horizons, "horizons");
  }
  load(false);
}

$("connect").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) return toast("填一下邮箱和密码");
  $("connect").disabled = true;
  try {
    const { user, token } = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ email, password }),
    });
    if (!user?.email) throw new Error("登录响应异常");
    if (token) storeSessionToken(token);
    me = user;
    $("password").value = "";
    showApp();
  } catch (e) {
    toast(e.message);
  } finally { $("connect").disabled = false; }
};
$("secretState").onclick = () => {
  activeRequest?.abort();
  clearSessionToken();
  me = null; $("list").replaceChildren(); closeDrawer();
  state.afterId = null;
  $("app").style.display = "none"; $("setup").style.display = "block";
};

$("more").onclick = () => load(true);
let debounce;
$("q").oninput = () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.q = $("q").value; state.afterId = null; load(false); }, 350);
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) && $("app").style.display !== "none") { e.preventDefault(); $("q").focus(); }
});
document.addEventListener("click", (e) => {
  const card = e.target.closest(".card.clickable");
  if (card) openDetail(card.dataset.id);
});
$("drawer").addEventListener("click", (e) => { if (e.target === $("drawer")) closeDrawer(); });

// 会话已在（回到页面时自动登录）
(async () => {
  try {
    const { user } = await api("/api/auth/me");
    if (user?.email) { me = user; showApp(); }
  } catch { /* 未登录 */ }
})();
</script>
</body>
</html>
